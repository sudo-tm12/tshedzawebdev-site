# TshedzaWebDev API on Cloudflare Workers (replaces the PHP API in ../api).
#   Local:  npx wrangler dev           (local D1 + emails kept in the outbox table)
#   Deploy: npx wrangler deploy        (see README.md → Cloudflare)
name = "tshedzawebdev-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Served at api.tshedzawebdev.co.za (Workers custom domain: wrangler creates the DNS record and certificate).
routes = [{ pattern = "api.tshedzawebdev.co.za", custom_domain = true }]
# Keep the workers.dev address too (wrangler turns it off when routes exist): older builds and
# tests use it, and it is a fallback if the custom domain ever has trouble.
workers_dev = true

# Run next to the database (Western Europe) rather than near each visitor: a quote makes
# several database calls, so one visitor round trip beats six SA↔EU database round trips.
[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "tshedzawebdev"
# Created 8 Nov 2026 (region WEUR, Western Europe).
database_id = "ddaf41d6-e525-491f-a8b0-229c7e668346"
migrations_dir = "migrations"

[vars]
# The site's workers.dev address is ours too, so it can be tested before the domain moves.
ALLOWED_ORIGINS = "https://tshedzawebdev.co.za,https://www.tshedzawebdev.co.za,https://tshedzawebdev.tshedzawebdev.workers.dev"
# Lead alerts and wall approvals. Straight to Gmail until info@ is forwarded there by Cloudflare
# Email Routing (docs/CLOUDFLARE.md step 5); then this can go back to info@tshedzawebdev.co.za.
OWNER_EMAIL = "tshedzamay@gmail.com"
MAIL_FROM = "TshedzaWebDev <info@tshedzawebdev.co.za>"
API_PUBLIC_URL = "https://api.tshedzawebdev.co.za"
# "resend" in production; "outbox" keeps emails in the database (local testing).
MAIL_TRANSPORT = "resend"

# Secrets (never in this file): npx wrangler secret put IP_SALT | WALL_SECRET | RESEND_API_KEY

# Daily housekeeping: 24-month lead retention, old rate events, unpublished wall notes.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
