# The website on Cloudflare (Pages is now part of Workers: a static-assets Worker, no server code).
#   Build first (npm run build → out/), then: npx wrangler deploy
# _headers and _redirects in out/ apply as they did on Pages.
name = "tshedzawebdev"
compatibility_date = "2026-10-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Served at the real domain (Workers custom domains: wrangler creates the DNS records and certificates,
# replacing the old cPanel A/CNAME records for these two names).
routes = [
  { pattern = "tshedzawebdev.co.za", custom_domain = true },
  { pattern = "www.tshedzawebdev.co.za", custom_domain = true },
]
# Keep the workers.dev address as well (wrangler turns it off when routes exist).
workers_dev = true
